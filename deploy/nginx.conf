# Serves the built excalidraw-app and forwards /api to excalidraw-server.
# Sits behind the host's TLS reverse proxy (Caddy), which sets X-Forwarded-*.

# the client IP as seen by Caddy, so the API's login rate limiting is per
# client rather than per proxy (Caddy reaches us from a private address)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # scene saves can be large; the API enforces its own per-route limits
  client_max_body_size 50m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /api/healthz {
    proxy_pass http://server:8080/healthz;
  }

  location /api/ {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # content-hashed build output
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # must be revalidated so new deploys are picked up
  location ~* ^/(index\.html|sw\.js|service-worker\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri =404;
  }

  # client-side routes (/w/:id, /board/:id) are served the app
  location / {
    try_files $uri $uri/ /index.html;
  }
}
